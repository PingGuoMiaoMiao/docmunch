name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The acceptance self-check reads the real commit history.
          fetch-depth: 0

      # Pinned to the toolchain this repository is developed and tested with,
      # so "passes locally" and "passes in CI" mean the same thing.
      - name: Install MoonBit
        # The official installer. Version-pinned URLs (binaries/<version>/...)
        # return 403 for every version I probed, including the one this machine
        # runs, so pinning is not possible today; CI installs `latest` and the
        # next step prints exactly which toolchain it got. If CI ever diverges
        # from the documented version, that output says so instead of hiding it.
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Toolchain and registry
        # `moon update` pulls the registry index; without it a clean runner
        # cannot resolve any dependency ("module was not found in the registry").
        run: |
          moon version --all
          moon update

      - name: Format
        run: moon fmt --check

      - name: Unit tests
        run: moon test

      - name: Build native binary
        run: moon build --target native

      - name: Extraction oracle comparison
        run: |
          mkdir -p tools/oracle/out-moonbit
          for f in fixtures/html/*.html; do
            name=$(basename "$f" .html)
            moon run cmd/main --target native -- extract "$f" > "tools/oracle/out-moonbit/$name.json"
          done
          python tools/compare.py

      - name: Acceptance self-check
        run: python tools/acceptance.py --skip-build

      - name: Markdown goldens
        run: python tools/markdown_golden.py

      - name: Section byte contract
        run: python tools/toc_check.py

      - name: MCP end-to-end (stdio)
        run: python tools/mcp_e2e.py

      - name: MCP end-to-end (HTTP)
        run: python tools/mcp_http_e2e.py

      - name: MCP auth end-to-end
        run: python tools/mcp_auth_e2e.py

      # The evidence scripts need the same third-party components they compare
      # against (LangChain splitters, rank_bm25, tiktoken, jieba). Installing
      # them here means every push re-verifies the numbers quoted in the docs.
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install langchain-text-splitters rank-bm25 tiktoken jieba annotated-types certifi

      - name: Section shape vs chunk size
        run: python tools/section_shape.py

      - name: Retrieval comparison vs real components
        run: python tools/retrieval_compare.py

      - name: Chinese tokenisation comparison
        run: python tools/cjk_eval.py

      - name: Self-index smoke (dogfood)
        run: python tools/selfindex.py

      - name: Conformance kit (ours + an independent implementation)
        run: |
          python conformance/selftest.py
          mkdir -p /tmp/refimpl
          python conformance/reference_impl.py --src docs/p5-index.md --out /tmp/refimpl
          python conformance/check.py --index /tmp/refimpl/index.json --raw /tmp/refimpl/raw

  # Documents drift away from the code faster than anyone notices. This checks
  # test-count claims against the real suite, ADR numbering for gaps/duplicates,
  # and that relative links resolve.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `moonbitlang/setup-moonbit` does not exist (404). This is the official
      # installer, the same one moonbitlang/core uses in its composite action.
      - name: Install MoonBit
        # The official installer. Version-pinned URLs (binaries/<version>/...)
        # return 403 for every version I probed, including the one this machine
        # runs, so pinning is not possible today; CI installs `latest` and the
        # next step prints exactly which toolchain it got. If CI ever diverges
        # from the documented version, that output says so instead of hiding it.
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Registry index, then self-check
        # The self-check runs `moon test` internally, so it needs the registry.
        run: |
          moon update
          python tools/selfcheck.py
