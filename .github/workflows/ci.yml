name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain versions
        run: moon version --all

      - name: Format
        run: moon fmt --check

      - name: Unit tests
        run: moon test

      - name: Build native binary
        run: moon build --target native

      - name: Extraction oracle comparison
        run: |
          mkdir -p tools/oracle/out-moonbit
          for f in fixtures/html/*.html; do
            name=$(basename "$f" .html)
            moon run cmd/main --target native -- extract "$f" > "tools/oracle/out-moonbit/$name.json"
          done
          python tools/compare.py

      - name: Acceptance self-check
        run: python tools/acceptance.py --skip-build

      - name: Markdown goldens
        run: python tools/markdown_golden.py

      - name: Section byte contract
        run: python tools/toc_check.py

      - name: MCP end-to-end (stdio)
        run: python tools/mcp_e2e.py

      - name: MCP end-to-end (HTTP)
        run: python tools/mcp_http_e2e.py

      - name: MCP auth end-to-end
        run: python tools/mcp_auth_e2e.py
